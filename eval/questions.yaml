# 教练系统深度测评集 v1（2026-10-24）
# 每题含：维度 | 问题 | 金标准答案（WorkBuddy 水准：判断→机制→数字→错误→下一步）
# 金标准要求：机制讲到生理层面、给出量化区间、指出常见错误、给个体化默认+追问点
meta:
  version: 1
  date: 2026-10-24
  purpose: 对比 coach-system 与高水准教练回答的差距，驱动持续优化
  scoring_dims: [机制深度, 量化程度, 个体化, 可溯源, 结构完整, 错误与安全]

questions:
  - id: Q01
    dim: 训练科学
    q: 我练了一年，卧推卡在80kg三个月了，重量加不上去，怎么办？
    gold: >
      判断：一年训练龄+3个月停滞属于典型中级平台期，先排除执行漏洞再谈突破。机制：力量进步=神经适应+肌肥大双通道，
      中级后神经适应红利耗尽，进步依赖渐进的肌肥大积累；长期同重量同次数使张力刺激低于适应阈值，身体无新刺激可适应。
      做法：①双渐进——重量不变先加次数（80kg从5次到8次），再回压重量；②加入变负荷：每周主项重量波动5%（重/中/轻日）；
      ③每6-8周安排一次deload（容量减半，1周），消除积累性疲劳——停滞常是疲劳掩盖了进步；④辅助肌群（三头、肩前束、背阔稳定）用2个辅助动作补短板。
      错误：连续冲大重量导致形态崩坏和伤病；忽视睡眠和蛋白质这些底盘。下一步：告诉我你现在80kg能做几次、一周练几推、睡眠和蛋白质情况，我帮你定8周突破计划。
      证据：渐进超负荷C01(A)、超量恢复与疲劳积累(B)。

  - id: Q02
    dim: 营养
    q: 增肌期每天每公斤体重到底吃多少蛋白质？植物蛋白和动物蛋白差别大吗？
    gold: >
      判断：增肌期1.6-2.2g/kg/天是证据最强的区间，取中间值2.0最稳妥；80kg约160g/天。机制：阻力训练后肌原纤维蛋白合成(MPS)
      需要亮氨酸触发（每次3g左右阈值），蛋白摄入本质是维持全天MPS的高频触发；超出2.2g/kg无额外合成收益，多余部分当能量烧掉。
      植物vs动物：动物蛋白（乳清、蛋、肉）亮氨酸含量高且消化快，单次刺激MPS效率更高；植物蛋白整体氨基酸谱略差，
      但2024年证据表明——只要把植物蛋白总量提到1.6倍左右（约2.2-2.5g/kg）或多种来源搭配（豆+谷互补），增肌效果与动物蛋白无显著差异。
      错误：只盯总量不看分布——单餐40g以上吸收率下降但仍可用，关键是3-4餐分散、每餐0.4g/kg左右；睡前20-40g酪蛋白/缓释蛋白有轻度额外收益。
      下一步：报体重和当前饮食，我帮你算到每餐。证据：蛋白质时机C45(A)、蛋白来源C47(B)。

  - id: Q03
    dim: 训练科学
    q: 每组都练到力竭是不是增肌效果最好？
    gold: >
      判断：不是。力竭有刺激价值但性价比低，主流方案留1-3次储备(RIR 1-3)。机制：力竭本身不是肥大的必要条件，
      机械张力才是；RIR 0-1与RIR 2-3的肥大效应在meta分析中相当，但力竭的疲劳成本高得多——力竭组恢复期延长24-48h、
      后续组数表现下滑、总容量反而降低；且力竭时动作稳定性下降，伤病风险升高。
      做法：大重量复合动作（深蹲/硬拉/卧推）留RIR 2-3；孤立小肌群（弯举/飞鸟）可以练到RIR 0-1，成本低收益实在；
      每组最后一个动作接近力竭即可，不必每组。判断RIR：还能标准完成2次=RIR2。
      错误：把"练到位"等同于"练到动不了"；复合动作频繁力竭导致慢性疲劳堆积。
      下一步：把当前计划的力竭习惯告诉我，我标出哪些组该留余量。证据：力竭与RIR C09(A)、疲劳管理(B)。

  - id: Q04
    dim: 计划设计
    q: 每个肌群一周练一次和练两次，效果差多少？我每周只能去4次健身房。
    gold: >
      判断：在总容量相同的前提下，频率2次/肌群对肥大略有优势但不大；频率的真正价值是容量分配——让每次训练质量更高。
      机制：MPS在训练后24-48h回落基线，每周1次刺激意味着每周约5天处于"无刺激窗口"；2次频率让合成窗口覆盖更满，
      且单次容量不必堆到15-20组（超过10组/次后组质量下降）。
      做法（每周4次最优解之一）：上/下分化×2——两次上肢（推拉权重不同）+两次下肢，每肌群每周2次、每次6-8个有效组，
      总量12-16组/肌群/周，正好落在4次内。对比：推拉腿4天会漏一腿或频率不足；bro split（每肌群1次）频率劣势。
      错误：容量堆在一次训练里；只练喜欢的部位导致结构失衡。
      下一步：告诉我优势部位和弱部位，我按上下分化给你排一周。证据：训练频率C05(A)、容量门槛C04(A)。

  - id: Q05
    dim: 减脂
    q: 减脂期要不要做有氧？做多少、做什么类型？
    gold: >
      判断：有氧是减脂的"热量预算工具"而不是必需品——核心赤字靠饮食，有氧负责扩大赤字并保心肺。推荐每周150-200分钟中低强度或2-3次HIIT。
      机制：减脂期肌肉保留靠三件事——阻力训练维持机械张力、蛋白质2.0-2.4g/kg、赤字别太深；有氧的干扰效应（concurrent training
      interference）主要发生在高强度大容量跑步与下肢力量训练叠加时，因为AMPK激活会部分抑制mTOR通路。
      做法：①优先走路/爬坡/单车等低冲击LISS，与腿部训练日错开或放在练后；②HIIT每周≤2-3次且不与深蹲日相邻；
      ③有氧递增原则同力量：从每周150分钟起步，平台期再加，别一上来就跑半马量。
      错误：靠大量有氧制造赤字同时砍碳水→掉肌肉；空腹有氧"燃脂更多"但全天净减脂无差异。
      下一步：告诉我每周能分配给有氧的时间和你现在的力量训练安排。证据：HIIT C43(A)、干扰效应(B)。

  - id: Q06
    dim: 技术伤病
    q: 深蹲时膝盖超过脚尖是不是很危险？
    gold: >
      判断：膝盖过脚尖本身不是危险信号，是深蹲的自然力学结果；真正要控制的是躯干过度前倾和脚跟离地。
      机制：下蹲深度越大，膝盖前移越多——这是保持重心在支撑面内的必然；强行限制膝盖前移（比如"垂直小腿"教法）
      会让躯干前倾角增大，把负荷从股四头转移到下背和髋，腰椎力矩反而上升约20-30%。膝盖前移增加的是髌股关节压力，
      但在无疼痛、渐进负荷的前提下，组织会适应这个压力（组织耐受原则）。
      做法：脚与肩同宽或略宽、脚尖外展15-30°，下蹲时膝盖对准第2-3脚趾方向；重心全脚掌；深度到髋低于膝（能力范围内渐进）。
      若有髌股疼痛：先降深度到无痛区间、减少前移（低杆位+略宽站距），同时做胫骨活动度和股四头渐进加载康复。
      错误：为了"不过脚尖"过度前倾压腰；有痛感硬蹲。下一步：你现在蹲到多深、有没有膝盖不适？有痛先按无痛深度练并描述痛感位置。
      证据：动作变式与个体差异(B)、疼痛红线R00。

  - id: Q07
    dim: 技术伤病
    q: 硬拉第二天腰有点酸，是正常反应还是受伤信号？怎么区分？
    gold: >
      判断：区分三档——①训练性酸痛：双侧、弥散、深部酸胀，24-72h自行消退，活动后减轻→正常DOMS，减量继续练；
      ②负荷过度信号：酸痛超过72h不退、晨起僵硬明显、弯腰系鞋带受限→降重量50%观察，评估硬拉 setups；
      ③红旗信号：单侧放射到臀腿的刺痛/麻木、咳嗽打喷嚏加重、夜间痛醒→立即停练就医，这是神经根受累特征。
      机制：硬拉的腰椎在等长抗伸展位承受大力矩，竖脊肌延迟酸痛很常见；但椎间盘和神经结构的问题表现为放射痛而非弥散酸痛——
      位置和性质（酸vs刺/麻）是关键鉴别点。
      做法：自查——正常呼吸弯腰摸脚尖测试：活动度受限伴疼痛→降级；无痛→多为肌肉性，可继续但复查技术
      （杠贴近小腿、脊柱中立、髋铰链主导而非蹲拉）。
      错误：酸了就完全躺平（轻度活动促进恢复）；出现放射痛还继续拉。下一步：告诉我疼痛位置、性质和持续时间，我按档位给方案；
      属于红旗档先就医。证据：疼痛红线R00、伤病鉴别(B)。

  - id: Q08
    dim: 技术伤病
    q: 我做杠铃肩推的时候肩膀前面会痛，应该怎么办？
    gold: >
      判断：肩前痛在推举中最常见于肩峰下空间激惹或胸小肌/前束紧张导致的肱骨头前移，先停激惹动作、做无痛替代，同时评估。
      机制：杠铃站姿推举要求肩关节外展外旋到底，若活动度不足（胸椎伸展差、肩外旋差），肱骨头会前滑撞击肩峰下结构
      （冈上肌腱/肩峰下滑囊）→前侧痛。长期只练推不练拉、圆肩体态会加重。
      做法：①暂停杠铃肩推2周，替代：哑铃半月亮推（角度收窄）、土地推举(landmine press)——肩外展角度小、前撞击风险低；
      ②每周2次水平拉（划船类）补齐推拉比到1:1以上；③胸小肌/背阔放松+肩外旋活动度（弹力带外旋、墙滑臂）每日5分钟。
      若痛持续超过2周或夜间痛→就医排查（肩峰下撞击/盂唇）。
      错误：忍痛继续推（激惹期重复撞击）；只换动作不修推拉比。
      下一步：痛感什么时候出现（全程/顶伸/下放）、平时推拉训练量比例如何？按你的答案我调计划。
      证据：肩伤高风险动作库(shoulder_risk)、疼痛红线R00。

  - id: Q09
    dim: 新手入门
    q: 完全新手应该用什么训练分化？练五休二可以吗？
    gold: >
      判断：新手最优不是分化而是全身或上下训练——每周3-4次全身，或4次上下分化。练五休二对新手是过度拆分。
      机制：新手的关键是高频复现动作模式（神经学习效率）而非单部位轰炸；新手恢复快但每次能承受的有效组数低
      （动作质量在10组后崩坏），单次大容量低质量不如高频短课；肌蛋白合成窗口短，每部位2-3次/周覆盖更满。
      做法：前8周——每周3次全身：深蹲/硬拉变式+水平推/垂直推+水平拉各3组×8-10，留RIR 2-3，重量以"能标准完成10次
      且最后2次吃力"为起点；动作库用低肩风险版（新手肩胛稳定性不足）。8周后动作稳定再转上下4天。
      错误：照搬高阶选手的5分化；第一周就冲力竭导致严重DOMS放弃训练。
      下一步：报身高体重和可训练时间，我给你出8周新手计划。证据：新手适应(C02 B)、频率C05(A)。

  - id: Q10
    dim: 情境决策
    q: 我每周只有3天、每次1小时，怎么安排力量训练效果最大化？
    gold: >
      判断：3天×1小时够用——优先大复合动作+最低有效容量，全身三分化轮转。机制：时间受限时价值排序是
      大肌群复合动作（多关节、激素与神经反应、时间效率最高）>孤立动作；每次1小时约能容纳15-18个高质量组。
      做法：①日A：深蹲+卧推+划船+核心；日B：硬拉+肩推+高位下拉+手臂；日C：下肢变式+上肢补弱——三周轮转或每周固定ABC；
      ②每动作3-4组×5-10次，复合动作留RIR 2，组间休息复合2-3min孤立60-90s；③热身压缩到8分钟（动态+递增组）；
      ④超级组（推+拉对置）省时不牺牲表现。
      错误：把时间花在器械孤立和腹肌上；休息刷手机导致总时长失控。
      下一步：告诉我器械条件和目标（增肌/减脂），我按ABC给你排出完整计划并落库。证据：容量C04(A)、复合动作优先(经验B)。

  - id: Q11
    dim: 恢复
    q: 练完腿第二天酸得走不了路，还能继续练吗？酸痛的原理是什么？
    gold: >
      判断：DOMS不是练废的标志也不是必须追求的目标；轻度酸痛可练（换部位或轻度活动），剧痛影响动作模式时换部位。
      机制：延迟性酸痛主流解释是离心收缩造成的肌纤维微损伤+炎症介质（前列腺素等）敏化痛觉，而非乳酸堆积
      （乳酸在运动后1-2h内已清除殆尽）；未适应人群或突然加量时最重，重复同样的训练后反应迅速衰减（repeated bout effect）。
      做法：①酸痛期做该部位的轻度活动（20-30min散步/轻阻力）促进血流，比完全静止恢复快；②疼痛评估：
      弥散酸胀→可照常练其他部位；局部锐痛/关节痛/明显肿胀→按伤病处理；③预防：容量渐进≤10%/周，离心阶段不刻意超慢。
      错误：把DOMS当有效训练的证明去追求；酸了就完全不动。
      下一步：描述一下疼痛性质和分布，我判断练还是停。证据：DOMS(B)、容量渐进C01(A)。

  - id: Q12
    dim: 恢复
    q: 睡眠不好对训练和增肌影响有多大？
    gold: >
      判断：影响大且常被低估——长期<6.5h睡眠会同时砍收益和加风险，睡眠是训练计划的一部分，不是计划外的事。
      机制：①合成端：深睡期生长激素分泌占全日约70%；睡眠限制一周，睾酮下降10-15%、MPS信号减弱；②分解端：
      睡眠不足升高皮质醇与炎症，减脂期肌肉丢失比例上升（同样赤字下掉瘦体重）；③表现端：反应力与力竭时间恶化，
      睡眠剥夺后RPE主观感受升高，同等负荷更累；④伤病：睡眠<6h与运动伤病率上升显著相关。
      做法：7-9h目标；固定起床时间比固定入睡时间更可执行；训练日睡前不安排高咖啡因（半衰期5-6h）；
      实在睡不够的那周主动降容量10-20%，别硬顶。
      错误：用咖啡因硬扛睡眠债；把睡眠差导致的停滞误判为计划失败乱换计划。
      下一步：报告平均睡眠时长，我把你的计划容量和睡眠数据联动起来管理。证据：睡眠与恢复C13(A)。

  - id: Q13
    dim: 补剂
    q: 肌酸到底怎么吃？长期吃安全吗？
    gold: >
      判断：肌酸一水化物是证据等级最高、性价比最高的合法补剂，3-5g/天长期吃，无需冲击期。机制：肌酸通过
      磷酸肌酸系统补充短时高强度能量（ATP再生的速度储备），同时细胞内水合增加会让体重+1-2kg（这是功能性水合不是虚胖）；
      长期补充提高训练容量承受力→间接放大肥大信号。
      做法：3-5g/天任意时间（随餐减少胃肠不适），无需循环、无需冲击（冲击期20g/天×5-7天只是提前1-2周达到饱和）；
      咖啡因大剂量与肌酸的反应存在个体争议但无确凿拮抗证据。
      安全：健康人群长期研究（最长5年）未见肾肝损害；肌酐上升是代谢产物不是肾损伤指标；肾病人群先问医生。
      错误：买贵的"进阶肌酸"（HCl等性价比无优势）；吃两天没效果就停（饱和需2-4周）。
      下一步：可以直接加入每日清单，无需询问剂量细节。证据：肌酸C44(A)。

  - id: Q14
    dim: 补剂
    q: 训练前喝咖啡有用吗？喝多少、什么时候喝？
    gold: >
      判断：有用，咖啡因是证据最充分的合法促力补剂，3-6mg/kg训练前45-60分钟摄入，力量耐力和主观用力度改善明确。
      机制：腺苷受体拮抗→降低主观疲劳感(RPE)、提高痛阈和募集驱动力；对耐力表现提升2-4%，对力量项目主要是
      降低RPE与提高重复次数。个体差异来自CYP1A2代谢基因（快代谢者受益更明显）。
      做法：①剂量3mg/kg起步（70kg约200mg≈一杯半美式），耐受后到6mg/kg；②训练前45-60min喝；③下午4点后训练的人
      控制在3mg/kg并考虑半衰期（5-6h）对睡眠的侵蚀——睡眠的合成价值高于咖啡因的表现增益，别捡芝麻丢西瓜；④习惯性大量喝咖啡者
      敏感性下降，训练日之外减量可恢复敏感性。
      错误：空腹大剂量导致手抖心悸反而影响动作；晚训喝双份浓缩然后失眠。
      下一步：告诉我你一般什么时间训练、平时咖啡习惯，我帮你定剂量。证据：咖啡因C46(A)。

  - id: Q15
    dim: 减脂
    q: 减脂期每周掉多少体重合适？掉太快有什么问题？
    gold: >
      判断：每周0.5-1.0%体重是肌肉保留与速度的平衡点；80kg即每周0.4-0.8kg。超过1.5%/周的激进减脂只适合高体脂人群短期用。
      机制：赤字越大、速度越快，瘦体重丢失比例越高——meta分析显示慢速减脂（~0.7%/周）比快速（~1.4%）保留更多瘦体重和力量；
      机制在于蛋白质分解随赤字加深而上升，且训练表现下降导致机械张力刺激减少；过快减脂还伴随瘦素下降、
      饥饿感上升、NEAT（非运动消耗）无意识减少，反弹概率更高。
      做法：①目标赤字300-500kcal/天（=每周0.3-0.5kg脂肪当量），配合力量训练全维持+蛋白2.0-2.4g/kg；
      ②体重按7日均值看趋势不看单日（水分波动±1kg正常）；③连续2周掉>1.2%体重→加100-200kcal；连续2周<0.3%→减100-200kcal。
      错误：每天称体重被水分波动打击；只砍碳水导致训练表现崩。
      下一步：报体重和饮食现状，我算你的赤字目标并按周设卡点。证据：减脂速度C42(A)、体成分管理(B)。

  - id: Q16
    dim: 减脂
    q: 我体重两周没变了，是不是平台期了？怎么破？
    gold: >
      判断：先审计再谈平台——两周不变+执行无漏洞才算真平台；大多数"平台"是摄入回升或NEAT下降造成的假平台。
      机制：减脂中的代谢适应是渐进的：体重下降→TDEE下降（基础代谢+活动消耗都缩水）+NEAT无意识减少（疲劳使人少动）
      →原赤字逐渐收窄；同时水分潴留（压力/高钠/经期）可以掩盖2-3周的脂肪下降——体脂在掉但体重不动的情况真实存在。
      做法：①审计3天：拍照记录全部饮食（估算热量）、步数、训练完成度；②执行确认无漏洞后调整：赤字加200-300kcal
      （优先砍碳水/脂肪保留蛋白）或有氧+150min，二选一渐进；③用腰围+照片+体重三角验证，别只看秤；④每减4-6kg体重
      重算一次TDEE。
      错误：直接砍到800kcal的极端操作；一天内多次称重对冲情绪。
      下一步：把三天饮食记录和体重曲线给我，我判断是执行问题还是代谢适应。证据：代谢适应(B)、体成分管理。

  - id: Q17
    dim: 营养
    q: 空腹有氧是不是燃脂效率更高？
    gold: >
      判断：单次运动中脂肪供能比例更高是真的，但24h总脂肪减少量与餐后有氧无差异——减脂看长期赤字，不看供能底物偏好。
      机制：空腹时胰岛素低、游离脂肪酸可用性高，运动中脂肪氧化比例上升；但脂肪氧化比例≠脂肪减量——24h能量平衡才是
      主导变量，餐后有氧组在多项对照中总量减脂相当；空腹状态皮质醇更高，长期大容量空腹有氧理论上增加肌肉分解风险
      （证据尚不一致，但有阻力训练+蛋白保障时影响有限）。
      做法：舒服和可持续优先——空腹有晨练便利性就空腹，胃不舒服就提前一根香蕉；真正要优化的是每周有氧总时长和力量训练执行率。
      错误：为"燃脂比例"牺牲训练总量的持续性；空腹高强度HIIT导致头晕。
      下一步：不用纠结时点，告诉我每周能做的有氧时长，我把它编进计划。证据：底物氧化与能量平衡(B)、HIIT C43(A)。

  - id: Q18
    dim: 热身恢复
    q: 训练前拉伸是必要的吗？ static stretching 会不会降低力量表现？
    gold: >
      判断：训练前长时间静态拉伸（>60s/肌群）会短暂降低最大力量与爆发力（约3-5%，持续约15分钟内），不推荐作为主要热身；
      动态热身+专项递增组是标准方案。机制：长时间静态拉伸降低肌腱刚性（弹性储能减少）与神经募集兴奋性；
      但对柔韧需求高的项目（体操/深蹲活动度）短时(<30s)拉伸无害。
      做法：①热身流程5-8分钟：2-3分钟低强度有氧提心率→动态活动度（髋/肩/踝绕环、摆腿）→正式动作空杆/50%递增组2-3组；
      ②静态拉伸放到训练后或单独时段，30-60s/次×2-3组，用于改善长期活动度而非热身；③伤病康复中由康复师指导的拉伸另说。
      错误：把热身时间全给静态压腿；完全不做热身直接上大重量。
      下一步：你的深蹲/肩推活动度卡点告诉我，我给你配针对性的动态热身清单。证据：热身与表现(B)。

  - id: Q19
    dim: 训练科学
    q: 组间休息到底歇多久？歇太久是不是浪费时间？
    gold: >
      判断：按目标分——力量：复合动作3-5分钟；肥厚：1.5-3分钟；耐力：30-90秒。肥厚训练歇够比压着休息更好，
      "短休息=更好泵感=更好增肌"是过时结论。机制：肥厚的核心变量仍是容量×张力（体积负荷=重量×次数），
      组间磷酸原恢复约需3分钟，休息不足→下一组重复次数下降→总容量下降，meta分析显示长休息组肥大效果不劣于甚至优于短休息组；
      代谢应激（泵感）是肥大的信号之一但非主变量。
      做法：①深蹲/硬拉/卧推主项：3-5分钟（力量目标5分钟）；②辅助孤立动作：90-120秒；③时间紧张用拮抗肌超级组
      （推+拉交替）——在保持每组表现的同时压缩总时长；④组间真正的浪费是刷手机超时，用计时器。
      错误：所有动作统一60秒休息导致复合动作后程崩；反过来组间歇8分钟拖垮总训练时间。
      下一步：把你的目标和单次可用时间给我，休息策略我直接写进计划每一条。证据：组间休息C11(A)。

  - id: Q20
    dim: 训练科学
    q: 离心阶段慢速下放（比如4秒下放）对增肌有用吗？
    gold: >
      判断：有适度价值——离心阶段张力更高且有肥大特异性刺激，2-4秒离心是合理默认；但刻意超慢（>6秒）会因负荷被迫大幅下降
      而得不偿失。机制：离心收缩的单位张力高于向心（被动结构+桥联共同承载）、单位肌群耗氧更低，2024年证据显示
      离心偏重训练在同等" effort"下肥大与力量效益相当或略优，且对肌腱健康有额外适应价值；但超慢离心（>6s）限制的总做功量
      下降更快，体积负荷缩水。
      做法：①默认节奏：向心1-2秒爆发、离心2-3秒有控制下放、底端不停留或短暂停（按动作）；②每周期选1-2个动作做
      离心偏重变式（如3-5秒离心深蹲，重量降20-30%）放于中周期；③肌腱康复场景（如髌腱）离心方案有专门剂量，不套用增肌节奏。
      错误：所有动作都超慢速导致总容量崩；离心冲太重导致DOMS过重影响频次。
      下一步：把你当前主要动作的节奏习惯说一下，我标注哪些动作值得改离心偏重。证据：节奏与TUT(B)、离心训练(2024研究)。

  - id: Q21
    dim: 营养
    q: 增肌一定要买蛋白粉吗？吃够蛋白粉是不是就不用管三餐了？
    gold: >
      判断：蛋白粉是便利性工具不是必需品——全食物优先，粉只补缺口；反过来"喝粉=够了"是典型本末倒置。
      机制：蛋白需求1.6-2.2g/kg/天，全食物完全可满足（100g鸡胸≈30g蛋白、一盒牛奶≈8g、两个鸡蛋≈12g、100g豆腐≈8g）；
      乳清的价值在于密度高（80%+）、吸收快、单次成本低廉的便利性，运动后窗口期的边际收益极小（全天总量与分布远比时机重要）；
      全食物额外带来微营养素、饱腹感和食物热效应。
      做法：①先算三餐实际蛋白总量，缺口>30g/天才值得加粉；②训练后30-60min内没有正餐条件→一勺乳清+香蕉是合格替代；
      ③预算有限排序：鸡蛋/牛奶/鸡腿肉>蛋白粉>其他补剂；④乳糖不耐换分离乳清或植物蛋白（大豆/豌豆，量补足即可）。
      错误：一天三杯粉却正餐乱吃；把蛋白粉当增肌开关。
      下一步：报一下你昨天三餐实际吃了什么，我算缺口再决定要不要粉。证据：蛋白来源C47(B)、蛋白质时机C45(A)。

